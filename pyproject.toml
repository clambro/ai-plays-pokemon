[project]
name = "ai-plays-pokemon"
version = "0.1.0"
description = ""
authors = [{ name = "Costa Lambrinoudis", email = "clambro.git@gmail.com" }]
requires-python = ">=3.14,<3.15"
readme = "README.md"
license = { file = "LICENSE" }
dependencies = [
    "pyboy==2.7.0",  # Updating Pyboy breaks existing save states so we pin it.
    "numpy>=2.5.1,<3",
    "pillow>=12.3.0,<13",
    "pydantic>=2.13.4,<3",
    "loguru>=0.7.3,<0.8",
    "openai>=2.49.0,<3",
    "genai-prices>=0.0.72,<0.0.73",
    "python-dotenv>=1.2.2,<2",
    "pydantic-settings>=2.14.2,<3",
    "aiofiles>=25.1.0,<26",
    "junjo[graphviz]>=0.50.0,<0.51",
    "sqlalchemy>=2.0.51,<3",
    "aiosqlite>=0.22.1,<0.23",
    "aiohttp>=3.14.3,<4",
    "logfire>=4.39.0,<5",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.1,<5",
    "ruff>=0.16.0,<0.17",
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0,<2",
    "poethepoet>=0.48.0,<0.49",
    "ty>=0.0.63,<0.0.64",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.poe.tasks]
unit_tests = "python -m pytest -k unit"
integration_tests = "python -m pytest -k integration"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203",  # 1 blank line required before class docstring
    "D401",  # First line of docstring should be in imperative mood: "{first_line}"
    "INP001",  # File {filename} is part of an implicit namespace package. Add an __init__.py.
    "COM812",  # Enforce trailing commas (handled by the formatter).
    "CPY001",  # Missing copyright notice (handled by the license file).
    "EM101",  # Raw string in exception.
    "EM102",  # f-string in exception.
    "TRY003",  # Avoid specifying long messages outside the exception class
    "FIX002",  # Line contains TODO
    "TD002",   # Missing author in TODO `# TODO(<author_name>): ...`
    "TD003",   # Missing TODO link
]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = [
    "database.base.SQLAlchemyBase",
    "junjo.BaseState",
    "pydantic.BaseModel",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pep8-naming]
classmethod-decorators = ["validator"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]  # Ignore unused imports in inits.
"test_*.py" = [
    "S101",  # Asserts.
    "SLF001",  # Private member access.
]
"prompts.py" = ["E501"]  # Ignore line length in prompts

[tool.pytest.ini_options]
python_files = "**/tests/**/test_*.py"
asyncio_mode = "auto"
addopts = [
    "--import-mode=importlib"
]
markers =[
    "unit: mark a test as a unit test.",
    "integration: mark a test as an integration test",
]
