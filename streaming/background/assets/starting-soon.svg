    </linearGradient>
    <radialGradient id="cyanGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(960 530) rotate(90) scale(500 860)">
      <stop stop-color="#00D4FF" stop-opacity="0.18"/>
